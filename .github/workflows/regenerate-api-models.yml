#
# Regenerates :core:api's OpenAPI-generated DTOs whenever the canonical spec
# in kluvs-api changes, and opens a PR against develop with the diff.
#
# Triggered by:
#   - repository_dispatch[api-spec-updated] — sent by kluvs-api's
#     notify-consumers.yml whenever openapi.json changes on its main branch.
#   - workflow_dispatch — for manual runs (any kluvs-api ref; defaults to main).
#
# No spec blob arrives in the dispatch payload (source_sha + source_repo only) —
# this workflow fetches openapi.json directly from kluvs-api at that SHA, the
# same fetch-don't-forward pattern kluvs-api itself uses when pulling from
# kluvs-backend.
#
# The PR is opened with a GitHub App installation token (kluvs-spec-bot), not GITHUB_TOKEN,
# so pull_request workflows (unit tests) run on it with no "Approve and run" step. Tokens
# are minted per run, expire within the hour, and are scoped to the one repo and permission
# each step needs.
#
# Human review/merge of the opened PR is the only manual step in the pipeline.
# chore/regenerate-api-models is a CI force-push target. Never commit manual work there.
#
# Secrets required:
#   SPEC_BOT_CLIENT_ID, SPEC_BOT_PRIVATE_KEY — org secrets for the kluvs-spec-bot GitHub
#     App (Contents read/write, Pull requests read/write; installed on kluvs-api and
#     kluvs-mobile).
#   SUPABASE_INTEGRATION_URL/KEY, SENTRY_DNS — only for Gradle configuration (see below).
#

name: Regenerate API Models

on:
  repository_dispatch:
    types: [api-spec-updated]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "kluvs-api ref to fetch openapi.json from (commit SHA or branch name, e.g. main)"
        required: false
        default: "main"
        type: string

permissions:
  contents: read

jobs:
  regenerate:
    name: Regenerate :core:api models
    runs-on: ubuntu-latest
    # Gradle evaluates every module's build.gradle.kts during configuration,
    # even when only :core:api:openApiGenerate is requested — :core:network's
    # BuildKonfig block requires SUPABASE_INTEGRATION_URL/KEY (via -Pbuildkonfig.flavor=integration
    # below; this job never calls BuildKonfig at runtime, integration is just the safer default
    # if that ever changes), and Sentry setup needs SENTRY_DNS.
    env:
      SUPABASE_INTEGRATION_URL: ${{ secrets.SUPABASE_INTEGRATION_URL }}
      SUPABASE_INTEGRATION_KEY: ${{ secrets.SUPABASE_INTEGRATION_KEY }}
      SENTRY_DNS: ${{ secrets.SENTRY_DNS }}

    steps:
      - name: Checkout kluvs-mobile
        uses: actions/checkout@v5
        with:
          ref: develop

      - name: Mint read-only kluvs-api token
        id: api-token
        # actions/create-github-app-token v3.4.0
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        with:
          client-id: ${{ secrets.SPEC_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SPEC_BOT_PRIVATE_KEY }}
          owner: kluvs-app
          repositories: kluvs-api
          permission-contents: read

      - name: Resolve kluvs-api commit
        id: source
        env:
          GH_TOKEN: ${{ steps.api-token.outputs.token }}
          REF: ${{ github.event.client_payload.source_sha || inputs.source_ref || 'main' }}
        run: |
          SHA=$(gh api "repos/kluvs-app/kluvs-api/commits/${REF}" --jq .sha)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Fetch openapi.json from kluvs-api
        env:
          GH_TOKEN: ${{ steps.api-token.outputs.token }}
          SHA: ${{ steps.source.outputs.sha }}
        run: |
          gh api "repos/kluvs-app/kluvs-api/contents/openapi.json?ref=${SHA}" \
            -H "Accept: application/vnd.github.raw+json" > core/api/openapi.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2 #TODO: Beware of version bump; it breaks the workflow
        with:
          gradle-home-cache-cleanup: true

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Regenerate models
        run: ./gradlew :core:api:openApiGenerate -Pbuildkonfig.flavor=integration

      - name: Mint kluvs-mobile PR token
        id: pr-token
        # actions/create-github-app-token v3.4.0
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        with:
          client-id: ${{ secrets.SPEC_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SPEC_BOT_PRIVATE_KEY }}
          owner: kluvs-app
          repositories: kluvs-mobile
          permission-contents: write
          permission-pull-requests: write

      - name: Open PR with regenerated models
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.pr-token.outputs.token }}
          base: develop
          branch: chore/regenerate-api-models
          delete-branch: true
          commit-message: "chore(api): regenerate models from kluvs-api@${{ steps.source.outputs.short }}"
          title: "chore(api): regenerate models from kluvs-api@${{ steps.source.outputs.short }}"
          body: |
            Regenerated `:core:api` DTOs from [`kluvs-api@${{ steps.source.outputs.short }}`](https://github.com/kluvs-app/kluvs-api/commit/${{ steps.source.outputs.sha }}).

            Unit tests run on this PR. If the app needs code changes, stack a fix PR on this branch (`--base chore/regenerate-api-models`); never commit to it directly.

            Opened automatically by `regenerate-api-models.yml` — review the diff and merge.
          add-paths: |
            core/api/openapi.json
            core/api/src/commonMain/kotlin/com/ivangarzab/kluvs/api/models/**
