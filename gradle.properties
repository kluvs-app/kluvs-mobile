#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx6144M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
# Auto-kill Gradle daemons idle for 10+ min (default is 3h): this is the backstop for daemons
# left behind after a session ends or spawned outside Claude (e.g. Android Studio sync),
# so they don't sit around eating RAM indefinitely.
org.gradle.daemon.idletimeout=600000

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#R8/Obfuscation
android.r8.optimizedResourceShrinking=true

#Variables
# This variable tells BuildKonfig which Supabase server to point at: production / integration
buildkonfig.flavor=integration
android.builtInKotlin=false
android.newDsl=false
